name: build-audio-enhancer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  NODE_VERSION: "22"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest # arm64 (Apple Silicon)
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/audio-enhancer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/audio-enhancer/engine/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/audio-enhancer/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/audio-enhancer/src-tauri

      - name: ffmpeg LGPL (descarga verificada en Windows, compilación mínima en macOS)
        run: python scripts/prepare_ffmpeg.py
      - name: Construir sidecar congelado
        working-directory: apps/audio-enhancer/engine
        run: uv sync --locked && uv run python scripts/build_sidecar.py
      - name: Verificar proveedores de ONNX Runtime en el binario congelado
        working-directory: apps/audio-enhancer/engine
        run: uv run pytest -s tests/test_frozen.py
      - name: Instalar dependencias de la interfaz
        run: pnpm install --frozen-lockfile
      - name: Construir instalador
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Registrar tamaño del instalador
        shell: bash
        run: |
          echo "### Instalador (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          ls -lh src-tauri/target/release/bundle/*/* | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: audio-enhancer-${{ matrix.os }}
          path: |
            apps/audio-enhancer/src-tauri/target/release/bundle/nsis/*.exe
            apps/audio-enhancer/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
